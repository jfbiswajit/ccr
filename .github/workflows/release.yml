name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=darwin  GOARCH=arm64  go build -ldflags="-X 'github.com/biswajit/ccr/cmd.version=${{ github.ref_name }}'" -o dist/ccr-mac-arm64 .
          GOOS=darwin  GOARCH=amd64  go build -ldflags="-X 'github.com/biswajit/ccr/cmd.version=${{ github.ref_name }}'" -o dist/ccr-mac-amd64 .
          GOOS=linux   GOARCH=amd64  go build -ldflags="-X 'github.com/biswajit/ccr/cmd.version=${{ github.ref_name }}'" -o dist/ccr-linux-amd64 .
          GOOS=windows GOARCH=amd64  go build -ldflags="-X 'github.com/biswajit/ccr/cmd.version=${{ github.ref_name }}'" -o dist/ccr-windows-amd64.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
